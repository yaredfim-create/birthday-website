<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Firitye!</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: #f8fafc;
            text-align: center;
            padding: 20px 12px;
            min-height: 100vh;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        header {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            padding: 30px 20px;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            margin-bottom: 30px;
        }
        .badge {
            display: inline-block;
            background: linear-gradient(90deg, #ec4899, #8b5cf6);
            color: #fff;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 1px;
            margin-bottom: 12px;
        }
        h1 {
            color: #fbbf24;
            font-size: 2.2rem;
            margin-bottom: 10px;
            font-weight: 800;
        }
        .wish-box {
            background: rgba(236, 72, 153, 0.1);
            border-left: 4px solid #ec4899;
            padding: 16px;
            border-radius: 12px;
            margin-top: 15px;
            text-align: center;
        }
        .wish-box p {
            font-size: 1.1rem;
            color: #e2e8f0;
            line-height: 1.6;
            font-style: italic;
        }
        .section-title {
            font-size: 1.4rem;
            color: #38bdf8;
            margin: 30px 0 15px;
            text-align: left;
            padding-left: 10px;
            border-left: 3px solid #ec4899;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 18px;
        }
        .card {
            background: rgba(30, 41, 59, 0.7);
            border-radius: 18px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            transition: transform 0.3s ease;
        }
        .card:hover {
            transform: translateY(-5px);
        }
        .card img, .card video {
            width: 100%;
            height: 340px;
            object-fit: cover;
            display: block;
        }
        footer {
            margin-top: 40px;
            padding: 20px;
            color: #94a3b8;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div class="badge">OCTOBER 9TH 🎈</div>
            <h1>Happy Birthday Firitye! ✨</h1>
            <div class="wish-box">
                <p>"Best wish my love, my care! Wishing you a day filled with endless joy, happiness, and all the love in the world." ❤️</p>
            </div>
        </header>

        <div class="section-title">Special Videos 🎥</div>
        <div class="grid">
            <div class="card">
                <video controls poster="https://images2.imgbox.com/39/3a/U5L2mE9V_o.jpg">
                    <source src="https://files.catbox.moe/97a55y.mp4" type="video/mp4">
                </video>
            </div>
            <div class="card">
                <video controls poster="https://images2.imgbox.com/8f/6a/N1D8K11g_o.jpg">
                    <source src="https://files.catbox.moe/r4g9sn.mp4" type="video/mp4">
                </video>
            </div>
        </div>

        <div class="section-title">Photo Memories 📸</div>
        <div class="grid">
            <div class="card">
                <img src="https://images2.imgbox.com/39/3a/U5L2mE9V_o.jpg" alt="Firitye">
            </div>
            <div class="card">
                <img src="https://images2.imgbox.com/5a/2f/B1G3SsmO_o.jpg" alt="Firitye">
            </div>
            <div class="card">
                <img src="https://images2.imgbox.com/8f/6a/N1D8K11g_o.jpg" alt="Firitye">
            </div>
            <div class="card">
                <img src="https://images2.imgbox.com/7c/41/u9X01fN1_o.jpg" alt="Firitye">
            </div>
        </div>

        <footer>
            <p>Made with ❤️ for Firitye</p>
        </footer>
    </div>

</body>
</html>
