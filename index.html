<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a16" />
      <stop offset="40%" stop-color="#121829" />
      <stop offset="80%" stop-color="#1a1025" />
      <stop offset="100%" stop-color="#05050d" />
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <linearGradient id="accent-gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f6d365" />
      <stop offset="100%" stop-color="#fda085" />
    </linearGradient>

    <linearGradient id="pink-rose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff758c" />
      <stop offset="100%" stop-color="#ff7eb3" />
    </linearGradient>

    <!-- Glow & Shadow Filters -->
    <filter id="glow-strong" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glow-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="15" stdDeviation="20" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <!-- Clip Paths for Photos -->
    <clipPath id="clip-main">
      <rect width="700" height="420" rx="24" />
    </clipPath>
    <clipPath id="clip-grid-1">
      <rect width="220" height="280" rx="18" />
    </clipPath>
    <clipPath id="clip-grid-2">
      <rect width="220" height="280" rx="18" />
    </clipPath>
    <clipPath id="clip-grid-3">
      <rect width="220" height="280" rx="18" />
    </clipPath>
  </defs>

  <!-- Dark Atmospheric Background -->
  <rect width="1200" height="1600" fill="url(#bg-grad)" />

  <!-- Ambient Glow Lights -->
  <circle cx="200" cy="250" r="300" fill="#ff758c" opacity="0.12" filter="url(#glow-strong)" />
  <circle cx="1000" cy="800" r="350" fill="#7b2cbf" opacity="0.1" filter="url(#glow-strong)" />
  <circle cx="400" cy="1400" r="280" fill="#f6d365" opacity="0.08" filter="url(#glow-strong)" />

  <!-- Decorative Sparkles / Floating Bokeh -->
  <g opacity="0.6">
    <circle cx="150" cy="120" r="3" fill="#ffffff" filter="url(#glow-soft)" />
    <circle cx="1050" cy="180" r="2" fill="#fda085" />
    <circle cx="850" cy="100" r="4" fill="#ffffff" filter="url(#glow-soft)" />
    <circle cx="90" cy="750" r="3" fill="#ff7eb3" />
    <circle cx="1120" cy="1150" r="2.5" fill="#f6d365" />
    <circle cx="100" cy="1420" r="4" fill="#ffffff" filter="url(#glow-soft)" />
    <!-- Small Cross Stars -->
    <path d="M 300,90 L 300,104 M 293,97 L 307,97" stroke="#ffffff" stroke-width="1.5" opacity="0.5" />
    <path d="M 950,450 L 950,468 M 941,459 L 959,459" stroke="#f6d365" stroke-width="2" opacity="0.7" filter="url(#glow-soft)" />
    <path d="M 180,1180 L 180,1194 M 173,1187 L 187,1187" stroke="#ff758c" stroke-width="1.5" opacity="0.6" />
  </g>

  <!-- Browser Header / Window Frame Bar -->
  <g transform="translate(100, 60)">
    <rect width="1000" height="1480" rx="30" fill="url(#card-grad)" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5" filter="url(#card-shadow)" />
    
    <!-- Top Mock Browser Bar -->
    <rect width="1000" height="55" rx="30" fill="#ffffff" fill-opacity="0.04" />
    <rect y="30" width="1000" height="25" fill="#ffffff" fill-opacity="0.04" />
    <!-- Window Controls Buttons -->
    <circle cx="35" cy="28" r="6" fill="#ff5f56" />
    <circle cx="55" cy="28" r="6" fill="#ffbd2e" />
    <circle cx="75" cy="28" r="6" fill="#27c93f" />
    <!-- Search / URL Bar -->
    <rect x="250" y="14" width="500" height="28" rx="14" fill="#000000" fill-opacity="0.25" stroke="#ffffff" stroke-opacity="0.08" />
    <text x="500" y="33" text-anchor="middle" fill="#ffffff" fill-opacity="0.4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" letter-spacing="0.5">🔒 www.happybirthdayfiritye.com</text>
  </g>

  <!-- HERO HEADER SECTION -->
  <g transform="translate(600, 210)" text-anchor="middle">
    <!-- Subtitle Date Badge -->
    <rect x="-90" y="0" width="180" height="34" rx="17" fill="url(#pink-rose)" opacity="0.2" />
    <rect x="-90" y="0" width="180" height="34" rx="17" fill="none" stroke="url(#pink-rose)" stroke-width="1" opacity="0.5" />
    <text y="22" fill="#ff7eb3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" letter-spacing="2">OCTOBER 9TH</text>

    <!-- Main Title -->
    <text y="85" fill="none" stroke="#000000" stroke-width="8" font-family="'Playfair Display', Georgia, serif" font-size="52" font-weight="800" letter-spacing="1.5" opacity="0.5">HAPPY BIRTHDAY FIRITYE!</text>
    <text y="85" fill="url(#accent-gold)" font-family="'Playfair Display', Georgia, serif" font-size="52" font-weight="800" letter-spacing="1.5" filter="url(#glow-soft)">HAPPY BIRTHDAY FIRITYE!</text>

    <!-- Decorative Heart Ribbon -->
    <path d="M -120,110 Q 0,125 120,110" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1" />
    <path d="M 0,120 L 0,115" stroke="url(#pink-rose)" stroke-width="2" />
  </g>

  <!-- FEATURED MAIN PHOTO CARD -->
  <g transform="translate(250, 360)">
    <!-- Card Frame Backing -->
    <rect width="700" height="420" rx="24" fill="#161b2e" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1" filter="url(#card-shadow)" />
    
    <!-- Image Content -->
    <g clip-path="url(#clip-main)">
      <image href="https://images2.imgbox.com/39/3a/U5L2mE9V_o.jpg" x="0" y="-30" width="700" height="480" preserveAspectRatio="xMidYMid slice" />
      <!-- Subtle Overlay Gradient for luxury feel -->
      <rect width="700" height="420" fill="linear-gradient(to top, rgba(10,10,22,0.6) 0%, transparent 40%)" />
    </g>

    <!-- Glowing Border Highlight -->
    <rect width="700" height="420" rx="24" fill="none" stroke="url(#accent-gold)" stroke-width="1.5" opacity="0.4" />
  </g>

  <!-- HEARTFELT DEDICATION BOX (MY WISH AND LOVE) -->
  <g transform="translate(200, 830)">
    <!-- Backdrop Card -->
    <rect width="800" height="180" rx="20" fill="#ffffff" fill-opacity="0.03" stroke="url(#pink-rose)" stroke-opacity="0.3" stroke-width="1.5" filter="url(#card-shadow)" />
    
    <!-- Floating Decorative Heart Accent -->
    <g transform="translate(400, 0)">
      <circle cx="0" cy="0" r="26" fill="#121829" stroke="url(#pink-rose)" stroke-width="1.5" filter="url(#glow-soft)" />
      <path d="M -8,-3 C -8,-8 -3,-11 0,-6 C 3,-11 8,-8 8,-3 C 8,3 0,8 0,11 C 0,8 -8,3 -8,-3 Z" fill="url(#pink-rose)" />
    </g>

    <!-- Message Content -->
    <text x="400" y="52" text-anchor="middle" fill="#ffffff" font-family="'Playfair Display', Georgia, serif" font-size="22" font-style="italic" font-weight="600" letter-spacing="0.5">
      "To My Care &amp; My Highest Wish"
    </text>

    <text x="400" y="92" text-anchor="middle" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="300" letter-spacing="0.3">
      Wishing you a day as breathtaking and beautiful as your smile[span_0](start_span)[span_0](end_span)[span_1](start_span)[span_1](end_span)[span_2](start_span)[span_2](end_span).
    </text>
    
    <text x="400" y="122" text-anchor="middle" fill="#ff7eb3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500" letter-spacing="0.4">
      May your year ahead be full of endless love, peace, and warmth. ❤️
    </text>
  </g>

  <!-- PHOTO GALLERY GRID SECTION -->
  <g transform="translate(240, 1060)">
    <!-- Gallery Title -->
    <text x="0" y="-15" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600" letter-spacing="1">MEMORIES &amp; MOMENTS 📸</text>
    <line x1="0" y1="-5" x2="720" y2="-5" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1" />

    <!-- Photo 1 -->
    <g transform="translate(0, 15)">
      <rect width="220" height="280" rx="18" fill="#161b2e" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1" filter="url(#card-shadow)" />
      <g clip-path="url(#clip-grid-1)">
        <image href="https://images2.imgbox.com/5a/2f/B1G3SsmO_o.jpg" x="0" y="0" width="220" height="280" preserveAspectRatio="xMidYMid slice" />
      </g>
      <rect width="220" height="280" rx="18" fill="none" stroke="url(#pink-rose)" stroke-width="1" opacity="0.3" />
    </g>

    <!-- Photo 2 -->
    <g transform="translate(250, 15)">
      <rect width="220" height="280" rx="18" fill="#161b2e" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1" filter="url(#card-shadow)" />
      <g clip-path="url(#clip-grid-2)">
        <image href="https://images2.imgbox.com/8f/6a/N1D8K11g_o.jpg" x="0" y="0" width="220" height="280" preserveAspectRatio="xMidYMid slice" />
      </g>
      <rect width="220" height="280" rx="18" fill="none" stroke="url(#accent-gold)" stroke-width="1" opacity="0.3" />
    </g>

    <!-- Photo 3 -->
    <g transform="translate(500, 15)">
      <rect width="220" height="280" rx="18" fill="#161b2e" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1" filter="url(#card-shadow)" />
      <g clip-path="url(#clip-grid-3)">
        <image href="https://images2.imgbox.com/7c/41/u9X01fN1_o.jpg" x="0" y="0" width="220" height="280" preserveAspectRatio="xMidYMid slice" />
      </g>
      <rect width="220" height="280" rx="18" fill="none" stroke="url(#pink-rose)" stroke-width="1" opacity="0.3" />
    </g>
  </g>

  <!-- FOOTER DEDICATION -->
  <g transform="translate(600, 1475)" text-anchor="middle">
    <text y="0" fill="#ffffff" fill-opacity="0.4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" letter-spacing="1">
      CREATED WITH FOREVER LOVE FOR FIRITYE ✨
    </text>
  </g>
</svg>
