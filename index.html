<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>መልካም ልደት Millen (ሚሊን)! 🎂🎉</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #fff;
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .hero {
            text-align: center;
            padding: 50px 20px 20px;
            position: relative;
            z-index: 2;
        }

        h1 {
            font-size: 3rem;
            color: #ff7675;
            text-shadow: 0 0 15px rgba(255, 118, 117, 0.6);
            margin-bottom: 10px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .subtitle {
            font-size: 1.3rem;
            color: #fd79a8;
            margin-bottom: 25px;
        }

        .profile-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            max-width: 450px;
            width: 90%;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            text-align: center;
            margin-bottom: 30px;
        }

        .profile-img {
            width: 170px;
            height: 170px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #fd79a8;
            box-shadow: 0 0 20px rgba(253, 121, 168, 0.5);
            margin-bottom: 15px;
        }

        .tiktok-handle {
            background: #ff0050;
            color: white;
            padding: 6px 15px;
            border-radius: 20px;
            font-size: 0.9rem;
            display: inline-block;
            margin-bottom: 15px;
            text-decoration: none;
            font-weight: bold;
        }

        .cake-container {
            margin: 30px 0;
            text-align: center;
            cursor: pointer;
        }

        .cake-emoji {
            font-size: 80px;
            transition: transform 0.3s;
        }

        .cake-container:hover .cake-emoji {
            transform: scale(1.1);
        }

        .btn {
            background: linear-gradient(45deg, #ff7675, #fd79a8);
            border: none;
            color: white;
            padding: 12px 30px;
            font-size: 1.1rem;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(253, 121, 168, 0.4);
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(253, 121, 168, 0.6);
        }

        .message-box {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 15px;
            padding: 20px;
            max-width: 600px;
            width: 90%;
            margin: 20px 0;
            line-height: 1.8;
            font-size: 1.1rem;
            border-left: 4px solid #fd79a8;
        }

        .balloon {
            position: fixed;
            bottom: -100px;
            opacity: 0.7;
            animation: float 8s infinite ease-in;
            z-index: 1;
        }

        @keyframes float {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-100vh) rotate(360deg); opacity: 0; }
        }

        footer {
            margin-top: auto;
            padding: 20px;
            font-size: 0.9rem;
            color: #a29bfe;
        }

        @media (max-width: 600px) {
            h1 { font-size: 2.2rem; }
            .hero { padding-top: 35px; }
            .profile-card { padding: 22px; }
            .message-box { font-size: 1rem; }
        }
    </style>
</head>
<body>
    <div class="balloon" style="left: 10%; animation-duration: 7s; font-size: 40px;">🎈</div>
    <div class="balloon" style="left: 30%; animation-duration: 9s; font-size: 50px;">🎂</div>
    <div class="balloon" style="left: 60%; animation-duration: 6s; font-size: 35px;">💖</div>
    <div class="balloon" style="left: 85%; animation-duration: 8s; font-size: 45px;">🎉</div>

    <div class="hero">
        <h1>መልካም ልደት! 🎂</h1>
        <p class="subtitle">Happy Birthday Millen! ✨</p>
    </div>

    <div class="profile-card">
        <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?q=80&w=500&auto=format&fit=crop" alt="Millen" class="profile-img">
        <h2>Millen (ሚሊን) ✨</h2>
        <br>
        <a href="https://www.tiktok.com/@millen538" target="_blank" rel="noopener noreferrer" class="tiktok-handle">🎵 @millen538</a>
        <p style="margin-top: 10px; color: #dfe6e9;">በዚህ ልዩ ቀን ፍፁም የሆነ ደስታና ስኬትን እንመኝልሻለን!</p>
    </div>

    <div class="cake-container" onclick="celebrate()">
        <div class="cake-emoji" id="cake">🎂</div>
        <button class="btn" type="button">ሻማውን እፉ በይ! 🕯️</button>
    </div>

    <div class="message-box">
        <h3>🎉 ለቅን እና ውብ አኗኗርሽ፡</h3>
        <p>
            መልካም የልደት ቀን ይሁንልሽ! በህይወትሽ የምታስቢያቸው መልካም ነገሮች ሁሉ እንዲሳኩ፣
            በደስታ እና በጤና የታጀበ አዲስ አመት ይሁንልሽ! 🌸✨
        </p>
    </div>

    <footer>
        <p>❤️ ለ Millen በታላቅ ፍቅር የተዘጋጀ!</p>
    </footer>

    <script>
        let hasCelebrated = false;

        function celebrate() {
            const cake = document.getElementById('cake');
            cake.textContent = '🎉✨🎂✨🎉';

            if (!hasCelebrated) {
                alert('🎉 መልካም ልደት Millen! መልካም ምኞት ተልኳል! 🎉');
                hasCelebrated = true;
            }

            for (let i = 0; i < 20; i++) {
                createConfetti();
            }
        }

        function createConfetti() {
            const confetti = document.createElement('div');
            confetti.textContent = ['✨', '🎉', '💖', '🎈', '⭐'][Math.floor(Math.random() * 5)];
            confetti.style.position = 'fixed';
            confetti.style.left = Math.random() * 100 + 'vw';
            confetti.style.top = Math.random() * 100 + 'vh';
            confetti.style.fontSize = Math.random() * 20 + 20 + 'px';
            confetti.style.zIndex = '999';
            confetti.style.pointerEvents = 'none';
            confetti.style.animation = 'pulse 0.8s ease-in-out infinite alternate';
            document.body.appendChild(confetti);

            setTimeout(() => confetti.remove(), 2000);
        }
    </script>
</body>
</html>
